<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Прости 💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

img{
    width:100%;
    height:100%;
    object-fit:cover;
    position:absolute;
    top:0;
    left:0;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.2);
}

.button{
    position:absolute;
    bottom:45px;
    left:50%;
    transform:translateX(-50%);
    padding:18px 45px;
    border:none;
    border-radius:40px;
    background:#ff4fa3;
    color:white;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 0 20px #ff4fa3;
    transition:.3s;
}

.button:hover{
    transform:translateX(-50%) scale(1.08);
}

.popup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.65);
}

.card{
    background:white;
    color:#222;
    padding:40px;
    border-radius:25px;
    text-align:center;
    max-width:420px;
    animation:show .35s;
}

.card h1{
    color:#ff4fa3;
    margin-bottom:15px;
}

.card button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:20px;
    background:#ff4fa3;
    color:white;
    cursor:pointer;
}

@keyframes show{
from{transform:scale(.7);opacity:0;}
to{transform:scale(1);opacity:1;}
}
</style>
</head>

<body>

<img src="cats.png" alt="">
<div class="overlay"></div>

<button class="button" onclick="openCard()">
💖 Нажми 💖
</button>

<div class="popup" id="popup">
<div class="card">
<h1>Прости 🥺</h1>
<p>
Не дуйся, пожалуйста. ❤️<br><br>
Мне очень жаль, если я тебя расстроил.<br>
Надеюсь, ты улыбнёшься, когда увидишь это. 🐱💕
</p>

<button onclick="closeCard()">❤️ Обнять ❤️</button>
</div>
</div>

<script>
function openCard(){
document.getElementById("popup").style.display="flex";
}

function closeCard(){
document.getElementById("popup").style.display="none";
}
</script>

</body>
</html>
